# ===========================================================================
# The "Work" list on the homepage. Kept oldest-first here; the template
# reverses it so the newest entry renders on top.
#
# Each entry renders as:
#
#   2013   Project · Company · Role
#          Description underneath.
#
# Fields:
#   year        required
#   name        the project; bold, the loudest part of the line
#   company     optional -- who it was for
#   role        optional -- what you were there
#   description optional -- one or two sentences underneath
#   url         optional -- makes the project name a link
#
# name, company and role are all optional and any combination works; the
# "·" separators collapse on their own around whichever parts you leave out.
# ===========================================================================


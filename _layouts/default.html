<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>

{% assign page_description = page.description | default: site.tagline %}
<meta name="description" content="{{ page_description }}" />
<meta name="author" content="{{ site.title }}" />
<link rel="canonical" href="{{ page.url | absolute_url }}" />

<meta property="og:type" content="website" />
<meta property="og:title" content="{{ page.title | default: site.title }}" />
<meta property="og:description" content="{{ page_description }}" />
<meta property="og:url" content="{{ page.url | absolute_url }}" />
<meta name="twitter:card" content="summary" />

<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}" />
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml" />
</head>

<body>

<main class="page">

  {% include header.html %}

  {{ content }}

  {% include footer.html %}

</main>

</body>
</html>
